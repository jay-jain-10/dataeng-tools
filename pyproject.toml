[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataeng-tools"
version = "0.1.0"
description = "Claude-powered specialist agents for data engineers: review, explain and document SQL, dbt, Airflow, Spark, warehouse and cloud configs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jay Jain" }]
dependencies = ["anthropic>=0.40", "click>=8.1", "pyyaml>=6", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
de = "dataeng_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataeng_tools = ["prompts/agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
